[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-route-planning-lab"
version = "1.0.0"
description = "Measured weighted-grid path planning with explicit footprint assumptions"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
